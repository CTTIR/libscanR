on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: test-coverage

permissions: read-all

jobs:
  test-coverage:
    uses: CTTIR/.github/.github/workflows/test-coverage.yaml@main
    with:
      # Local synthetic maintenance suite exceeds the 90% floor.
      # The shared workflow enforces this floor independently of Codecov.
      floor: 90
    secrets: inherit
